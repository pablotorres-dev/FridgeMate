# Tests run against a throwaway in-memory database rather than the developer's
# H2 file, so running them never touches or seeds real local data.
spring.datasource.url=jdbc:h2:mem:fridgemate-test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.h2.console.enabled=false

app.jwt.secret=test-only-signing-key
app.jwt.expiration-days=1

# Left empty on purpose: no test may reach a real AI provider.
app.gemini.api-key=
