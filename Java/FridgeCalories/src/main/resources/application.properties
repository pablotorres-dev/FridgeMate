spring.application.name=fridgecalories

# Embedded H2 database, persisted to a local file next to the app (./data/fridgemate.mv.db).
# No external database server needed — the app owns its own storage.
spring.datasource.url=jdbc:h2:file:./data/fridgemate;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Browse the data at http://localhost:8080/h2-console (JDBC URL above, user "sa", no password)
spring.h2.console.enabled=true

# Signing key for auth tokens. This development-only default keeps local setup
# to zero steps; production supplies its own via JWT_SECRET (see the prod profile).
# Changing it invalidates every issued token, logging everyone out.
app.jwt.secret=local-development-only-signing-key-do-not-use-in-production
app.jwt.expiration-days=30

# Nutrition analysis. Deliberately optional: with no key the feature reports
# itself as unavailable instead of stopping the app from starting, so the rest
# of the app runs fine without one.
app.gemini.api-key=${GEMINI_API_KEY:}
# An alias rather than a pinned version, on purpose: Google retires specific
# model versions, and a pinned one silently starts returning 404 long after
# the code was last touched. The alias always resolves to the current Flash
# model. Override with APP_GEMINI_MODEL to pin a version deliberately.
app.gemini.model=${APP_GEMINI_MODEL:gemini-flash-latest}
