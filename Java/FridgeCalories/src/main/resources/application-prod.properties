# Production profile: managed PostgreSQL instead of the local H2 file.
# All values come from environment variables set by the hosting platform,
# so no credentials ever live in the repository.
spring.datasource.url=${JDBC_DATABASE_URL}
spring.datasource.username=${JDBC_DATABASE_USERNAME}
spring.datasource.password=${JDBC_DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# --- Startup time ---
# The free tier stops the service when idle and gives it very little CPU, so a
# cold start costs the visitor real waiting time. These trim the work done
# before the app can serve its first request.

# Naming the dialect saves a round of metadata probing against the database,
# which is slow when it sits in another region.
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Opening one connection is enough to boot; the pool grows on demand. Each
# connection costs a TLS handshake to a remote database.
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=5

# Off by default in most setups but explicit here: keeping a session open for
# the whole request holds a connection longer than this app ever needs.
spring.jpa.open-in-view=false

# The H2 web console must never be exposed on a public deployment.
spring.h2.console.enabled=false

# Must be set, and must stay stable across deploys — a new value logs everyone out.
app.jwt.secret=${JWT_SECRET}

# Hosting platforms inject the port to bind to.
server.port=${PORT:8080}
