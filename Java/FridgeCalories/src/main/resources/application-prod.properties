# Production profile: managed PostgreSQL instead of the local H2 file.
# All values come from environment variables set by the hosting platform,
# so no credentials ever live in the repository.
spring.datasource.url=${JDBC_DATABASE_URL}
spring.datasource.username=${JDBC_DATABASE_USERNAME}
spring.datasource.password=${JDBC_DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# --- Startup time ---
# The free tier stops the service when idle and gives it very little CPU, so a
# cold start costs the visitor real waiting time. These trim the work done
# before the app can serve its first request.

# Naming the dialect saves a round of metadata probing against the database,
# which is slow when it sits in another region.
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Hold no connection open when nothing is happening. This used to keep one
# ready to save a TLS handshake on the first request after a cold start — worth
# it back when the service was stopped for being idle. An uptime monitor now
# keeps it running instead, and a permanently open connection has the opposite
# effect: the managed database can never suspend itself either, so it bills for
# compute around the clock while the app sits doing nothing. Reopening a
# connection costs about a second; leaving one open costs every idle hour.
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=5
# Drain the pool quickly once a burst of requests is over, so the idle stretches
# are long enough for the database to suspend.
spring.datasource.hikari.idle-timeout=60000

# Off by default in most setups but explicit here: keeping a session open for
# the whole request holds a connection longer than this app ever needs.
spring.jpa.open-in-view=false

# The H2 web console must never be exposed on a public deployment.
spring.h2.console.enabled=false

# Must be set, and must stay stable across deploys — a new value logs everyone out.
app.jwt.secret=${JWT_SECRET}

# Hosting platforms inject the port to bind to.
server.port=${PORT:8080}
