services:
  - type: web
    name: fridgemate
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    # Keep the app in Europe, close to the database.
    region: frankfurt
    healthCheckPath: /
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Database credentials are entered in the Render dashboard, never committed.
      # Expected format: jdbc:postgresql://<host>/<database>?sslmode=require
      - key: JDBC_DATABASE_URL
        sync: false
      - key: JDBC_DATABASE_USERNAME
        sync: false
      - key: JDBC_DATABASE_PASSWORD
        sync: false
      # Signs the auth tokens. Generated once and kept stable — changing it
      # invalidates every session and signs all users out.
      - key: JWT_SECRET
        generateValue: true
