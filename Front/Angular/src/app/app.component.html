@if (isSignedIn) {
  <nav class="app-nav">
    <span class="brand">🧊 FridgeMate</span>
    <div class="nav-links">
      <a routerLink="/inventory" routerLinkActive="active">Inventory</a>
      <a routerLink="/shopping-list" routerLinkActive="active">🛒 Shopping List</a>
      <a routerLink="/shop" routerLinkActive="active">🛍️ Shop</a>
    </div>
    <div class="nav-user">
      <span class="username">{{ username }}</span>
      <button type="button" class="secondary" (click)="logout()">Sign out</button>
    </div>
  </nav>
}

<router-outlet />
