<form class="card shopping-list-item-form" (ngSubmit)="submit()">
  <h2>{{ isEditing ? 'Edit tracked product' : 'Track a product' }}</h2>

  <div class="field-grid">
    <label>
      Name
      <input type="text" [(ngModel)]="model.name" name="name" required />
    </label>

    <label>
      Unit <span class="optional">(optional)</span>
      <input type="text" placeholder="e.g. packs, kg, units" [(ngModel)]="model.unit" name="unit" />
    </label>

    <label>
      Minimum quantity
      <input type="number" min="0.01" step="any" [(ngModel)]="model.minQuantity" name="minQuantity" required />
    </label>
  </div>

  <div class="actions">
    <button type="submit" class="primary">{{ isEditing ? 'Save changes' : 'Track product' }}</button>
    @if (isEditing) {
      <button type="button" class="secondary" (click)="cancelEdit()">Cancel</button>
    }
  </div>
</form>
